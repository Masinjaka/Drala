<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url('../../../assets/fonts/Alexandria-ExtraBold.ttf');font-weight:800}
@font-face{font-family:A;src:url('../../../assets/fonts/Alexandria-Bold.ttf');font-weight:700}
*{margin:0;box-sizing:border-box}
html,body{width:1024px;height:500px;overflow:hidden}
body{position:relative;font-family:A;background:#059669}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px);background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse 60% 70% at 50% 50%,transparent 0%,#000 75%)}
.card{position:absolute;width:236px;border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(2,44,30,.35),0 2px 6px rgba(2,44,30,.2)}
.card img{display:block;width:100%}
.c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:440px;text-align:center}
.tag{display:inline-block;background:#D9F45A;color:#0A0C10;font-weight:700;font-size:15px;letter-spacing:2.5px;padding:5px 10px 4px;margin-bottom:16px}
h1{color:#fff;font-weight:800;font-size:54px;line-height:1.02;letter-spacing:-1.5px}
h1 em{font-style:normal;color:#0A0C10}
p{margin-top:16px;color:rgba(255,255,255,.92);font-weight:700;font-size:18px;line-height:1.35}
</style></head><body><div class="grid"></div>
<div class="card" style="left:30px;top:70px;transform:rotate(-6deg)"><img src="balance.png"></div>
<div class="card" style="left:34px;top:316px;transform:rotate(4deg)"><img src="ai.png"></div>
<div class="card" style="right:30px;top:48px;transform:rotate(5deg)"><img src="donut.png"></div>
<div class="card" style="right:32px;top:322px;transform:rotate(-4deg)"><img src="envelope.png"></div>
<div class="c"><div class="tag">SUIVI DE BUDGET AVEC IA</div>
<h1>Votre argent,<br><em>enfin clair</em></h1>
<p>Revenus, dépenses, enveloppes<br>et portefeuilles au même endroit</p></div>
</body></html>
