<script>// Injected into every composition page. Fits text deterministically and
// collects measurable QA facts the engine turns into the render report.
window.__ssd = { issues: [], boxes: [], ready: false };
(async function () {
  const canvas = document.querySelector('.ssd-canvas');
  const W = canvas.clientWidth, H = canvas.clientHeight;
  await document.fonts.ready;
  const fams = (window.__ssdFonts || []);
  for (const f of fams) {
    try { await document.fonts.load(`700 40px "${f}"`); await document.fonts.load(`400 40px "${f}"`); } catch (e) { /* reported below */ }
    if (!document.fonts.check(`40px "${f}"`)) window.__ssd.issues.push({ level: 'error', code: 'font-missing', message: `Font "${f}" did not load — text would render in a fallback face.` });
  }
  const imgs = [...document.images];
  await Promise.all(imgs.map((i) => (i.complete ? null : new Promise((r) => { i.onload = i.onerror = r; }))));
  for (const i of imgs) if (!i.naturalWidth) window.__ssd.issues.push({ level: 'error', code: 'image-missing', message: `Image failed to load: ${i.getAttribute('src')}` });

  const lineCount = (el) => {
    const r = document.createRange(); r.selectNodeContents(el);
    const tops = new Set([...r.getClientRects()].filter((x) => x.width > 1).map((x) => Math.round(x.top / 4)));
    return tops.size;
  };
  for (const el of document.querySelectorAll('.ssd-text[data-fit]')) {
    const maxLines = +el.dataset.maxLines || 0;
    const startSize = parseFloat(getComputedStyle(el).fontSize);
    const minSize = (+el.dataset.minSize || 0) ? (+el.dataset.minSize) * W / 100 : startSize * 0.6;
    let size = startSize;
    const fixedH = el.style.height && el.style.height !== 'auto';
    const tooBig = () => (maxLines && lineCount(el) > maxLines) || (fixedH && el.scrollHeight > el.clientHeight + 1) || el.scrollWidth > el.clientWidth + 1;
    while (tooBig() && size > minSize) { size *= 0.97; el.style.fontSize = size + 'px'; }
    if (tooBig()) window.__ssd.issues.push({ level: 'error', code: 'text-overflow', id: el.dataset.id, message: `Text "${el.textContent.slice(0, 40)}" does not fit even at the minimum size.` });
    if (size < startSize) el.dataset.shrunk = (size / startSize).toFixed(2);
  }
  for (const el of document.querySelectorAll('.ssd-layer')) {
    const r = el.getBoundingClientRect();
    if (el.closest('.ssd-panorama') && el.classList.contains('ssd-panorama')) continue;
    const box = { id: el.dataset.id, kind: el.dataset.kind, role: el.dataset.role, x: r.left, y: r.top, w: r.width, h: r.height };
    if (el.dataset.kind === 'text') {
      const cs = getComputedStyle(el);
      Object.assign(box, { fontSize: parseFloat(cs.fontSize), color: cs.color, lines: lineCount(el), text: el.textContent, shrunk: el.dataset.shrunk || null, fontFamily: cs.fontFamily });
      const visible = { x0: Math.max(0, r.left), y0: Math.max(0, r.top), x1: Math.min(W, r.right), y1: Math.min(H, r.bottom) };
      if (visible.x1 - visible.x0 < r.width - 1 || visible.y1 - visible.y0 < r.height - 1) {
        if (!el.closest('.ssd-panorama')) window.__ssd.issues.push({ level: 'error', code: 'text-clipped', id: el.dataset.id, message: `Text "${el.textContent.slice(0, 40)}" extends beyond the canvas.` });
      }
    }
    window.__ssd.boxes.push(box);
  }
  window.__ssd.canvas = { W, H };
  window.__ssd.ready = true;
})();
</script>
