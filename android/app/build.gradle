import java.util.Properties
import java.io.FileInputStream
import java.util.Base64

plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def signingValue = { String environmentName, String propertyName ->
    System.getenv(environmentName) ?: keystoreProperties[propertyName]
}
def releaseStoreFile = signingValue('ANDROID_KEYSTORE_PATH', 'storeFile')
def releaseStorePassword = signingValue(
    'ANDROID_KEYSTORE_PASSWORD',
    'storePassword',
)
def releaseKeyAlias = signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
def hasReleaseSigning = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { value -> value?.toString()?.trim() }
def isReleaseBuild = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('release')
}
def dartDefines = [:]
(project.findProperty('dart-defines') ?: '').split(',').findAll { it }.each { encoded ->
    def entry = new String(Base64.decoder.decode(encoded), 'UTF-8')
    def separator = entry.indexOf('=')
    if (separator > 0) dartDefines[entry.substring(0, separator)] = entry.substring(separator + 1)
}
def admobAppId = dartDefines['ADMOB_ANDROID_APP_ID'] ?: 'ca-app-pub-3940256099942544~3347511713'
if (!(admobAppId ==~ /ca-app-pub-[0-9]{16}~[0-9]{10}/)) {
    throw new GradleException('ADMOB_ANDROID_APP_ID is not a valid AdMob app ID.')
}

if (isReleaseBuild && !hasReleaseSigning) {
    throw new GradleException(
        'Release signing is not configured. Provide android/key.properties '
            + 'or ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, '
            + 'ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD.',
    )
}

android {
    namespace = "com.masinjaka.drala"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.masinjaka.drala"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders['admobApplicationId'] = admobAppId
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
